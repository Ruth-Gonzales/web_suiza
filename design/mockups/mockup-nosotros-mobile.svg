<?xml version="1.0" encoding="utf-8"?>
<!-- Mockup: Nosotros — Mobile (390x844) -->
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <style>
      .label{fill:#0B2A66;font-family:Inter, Arial, Helvetica, sans-serif;font-size:10px}
      .h1{fill:#07204A;font-family:Inter, Arial, Helvetica, sans-serif;font-weight:700;font-size:24px}
      .lead{fill:#07204A;font-family:Inter, Arial, Helvetica, sans-serif;font-weight:500;font-size:14px}
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />
  <!-- NAV -->
  <rect x="0" y="0" width="390" height="56" fill="#ffffff"/>
  <text x="16" y="36" class="label">Logo</text>

  <!-- HERO (clean) -->
  <rect x="0" y="56" width="390" height="200" fill="#dbeafe"/>
  <text x="20" y="150" class="h1">IESTP SUIZA</text>

  <!-- CONTENT (stacked) -->
  <g transform="translate(12,268)">
    <rect width="366" height="540" rx="8" fill="#ffffff" stroke="#eef2ff"/>
    <text x="18" y="36" class="h1">Sobre nosotros</text>
    <text x="18" y="64" class="lead">Introducción breve para lectura en móvil.</text>
    <rect x="18" y="84" width="330" height="220" rx="6" fill="#ffffff" stroke="#eef2ff" />
    <text x="26" y="110" class="label">Contenido principal — limpio</text>

    <!-- Retícula: Hidden on mobile per responsive rules (indicated) -->
    <text x="18" y="330" class="label">Retícula fragment: ocultada en móvil (prioridad lectura)</text>
  </g>

  <!-- FOOTER -->
  <rect x="0" y="812" width="390" height="32" fill="#ffffff"/>
  <text x="16" y="834" class="label">Footer — limpio</text>
</svg>