<?xml version="1.0" encoding="utf-8"?>
<!-- Mockup Review: Nosotros — Desktop (1440x900) - REVIEW MODE (higher visibility) -->
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      .bg{fill:#F8FBFF}
      .white{fill:#ffffff}
      .nav{fill:#ffffff}
      .muted{fill:#f1f5f9}
      .stroke{stroke:#0B2A66;stroke-width:2}
      .navy{fill:#0B2A66}
      .label{fill:#0B2A66;font-family:Inter, Arial, Helvetica, sans-serif;font-size:12px}
      .h1{fill:#07204A;font-family:Inter, Arial, Helvetica, sans-serif;font-weight:700;font-size:36px}
      .lead{fill:#07204A;font-family:Inter, Arial, Helvetica, sans-serif;font-weight:500;font-size:18px}
    </style>
  </defs>

  <!-- Page background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- NAVBAR (clean) -->
  <rect x="0" y="0" width="1440" height="72" fill="#ffffff" />
  <text x="40" y="44" class="label">Logo</text>
  <text x="120" y="44" class="label">Inicio &nbsp;&nbsp; Nosotros &nbsp;&nbsp; Carreras &nbsp;&nbsp; Noticias</text>

  <!-- HERO (clean photo placeholder) -->
  <rect x="0" y="72" width="1440" height="300" fill="#dbeafe"/>
  <text x="80" y="220" class="h1">IESTP SUIZA</text>
  <text x="80" y="250" class="lead">Formación técnica con identidad regional y proyección tecnológica.</text>

  <!-- Spacer -->
  <rect x="0" y="372" width="1440" height="48" fill="#ffffff" />

  <!-- CONTENT CONTAINER (white) centered -->
  <g transform="translate(120,432)">
    <rect width="1200" height="420" rx="8" fill="#ffffff" stroke="#e6eefc" stroke-width="1"/>

    <!-- Left column (text) -->
    <text x="28" y="42" class="h1">Sobre nosotros</text>
    <text x="28" y="74" class="lead">Instituto Superior Tecnológico Público Suiza — vocación técnica con identidad amazónica.</text>
    <rect x="28" y="100" width="520" height="260" rx="6" fill="#ffffff" stroke="#eef2ff"/>
    <text x="36" y="124" class="label">Párrafo de introducción (placeholder) — primer bloque de texto. Este espacio queda limpio para lectura.</text>

    <!-- Right column (stats) -->
    <rect x="580" y="40" width="560" height="120" rx="8" fill="#ffffff" stroke="#eef2ff"/>
    <text x="592" y="80" class="label">Estadística 1</text>
    <rect x="580" y="176" width="560" height="160" rx="8" fill="#ffffff" stroke="#eef2ff"/>
    <text x="592" y="204" class="label">Caja de datos / cards (limpias)</text>

    <!-- RETÍCULA FRAGMENT (top-right) - REVIEW VISIBLE -->
    <g transform="translate(1200,-18)" opacity="0.24">
      <!-- visible retícula of silent modules: series of small rects and gaps -->
      <!-- row 1 -->
      <rect x="0" y="0" width="28" height="64" fill="#0B2A66"/>
      <rect x="36" y="0" width="28" height="64" fill="#0B2A66"/>
      <rect x="72" y="0" width="28" height="64" fill="#0B2A66"/>
      <!-- row 2 -->
      <rect x="0" y="76" width="28" height="64" fill="#0B2A66"/>
      <rect x="36" y="76" width="28" height="64" fill="#0B2A66"/>
      <rect x="72" y="76" width="28" height="64" fill="#0B2A66"/>
    </g>

    <!-- annotation -->
    <text x="28" y="380" class="label">(Review) Fragment retícula top-right — size ≈ 28% × 22% container — opacity 24% (visible for review)</text>
  </g>

  <!-- FOOTER (clean) -->
  <rect x="0" y="870" width="1440" height="30" fill="#ffffff"/>
  <text x="120" y="892" class="label">Footer — limpio</text>

</svg>