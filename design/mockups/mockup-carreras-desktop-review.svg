<?xml version="1.0" encoding="utf-8"?>
<!-- Mockup Review: Carreras — Desktop (1440x900) - REVIEW MODE -->
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      .label{fill:#0B2A66;font-family:Inter, Arial, Helvetica, sans-serif;font-size:12px}
      .h1{fill:#07204A;font-family:Inter, Arial, Helvetica, sans-serif;font-weight:700;font-size:32px}
      .card{fill:#ffffff;stroke:#eef2ff}
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />
  <rect x="0" y="0" width="1440" height="72" fill="#ffffff" />
  <text x="40" y="44" class="label">Logo</text>

  <text x="120" y="140" class="h1">Carreras</text>
  <text x="120" y="172" class="label">Explora nuestros programas técnicos</text>

  <rect x="120" y="188" width="1200" height="44" rx="8" fill="#ffffff" stroke="#eef2ff"/>

  <g transform="translate(120,252)">
    <rect class="card" x="0" y="0" width="352" height="160" rx="10"/>
    <rect class="card" x="392" y="0" width="352" height="160" rx="10"/>
    <rect class="card" x="784" y="0" width="352" height="160" rx="10"/>
    <rect class="card" x="0" y="200" width="352" height="160" rx="10"/>
    <rect class="card" x="392" y="200" width="352" height="160" rx="10"/>
    <rect class="card" x="784" y="200" width="352" height="160" rx="10"/>
    <text x="12" y="24" class="label">Cards limpias — sin patrón interior</text>
  </g>

  <!-- Retícula fragment bottom-left - REVIEW VISIBLE -->
  <g transform="translate(40,700)" opacity="0.24">
    <rect x="0" y="0" width="24" height="56" fill="#0B2A66"/>
    <rect x="32" y="0" width="24" height="56" fill="#0B2A66"/>
    <rect x="64" y="0" width="24" height="56" fill="#0B2A66"/>
    <rect x="96" y="0" width="24" height="56" fill="#0B2A66"/>
  </g>

  <text x="120" y="880" class="label">(Review) Retícula bottom-left fragment — width ≈22% container, opacity 24%</text>

  <rect x="0" y="870" width="1440" height="30" fill="#ffffff"/>
</svg>