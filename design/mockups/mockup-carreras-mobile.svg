<?xml version="1.0" encoding="utf-8"?>
<!-- Mockup: Carreras — Mobile (390x844) -->
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <style>
      .label{fill:#0B2A66;font-family:Inter, Arial, Helvetica, sans-serif;font-size:10px}
      .h1{fill:#07204A;font-family:Inter, Arial, Helvetica, sans-serif;font-weight:700;font-size:22px}
      .card{fill:#ffffff;stroke:#eef2ff}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" />
  <rect x="0" y="0" width="390" height="56" fill="#ffffff"/>
  <text x="16" y="36" class="label">Logo</text>

  <text x="16" y="92" class="h1">Carreras</text>
  <rect x="16" y="112" width="358" height="40" rx="8" fill="#ffffff" stroke="#eef2ff"/>

  <!-- Grid: single column cards -->
  <g transform="translate(16,168)">
    <rect class="card" x="0" y="0" width="358" height="120" rx="10"/>
    <rect class="card" x="0" y="144" width="358" height="120" rx="10"/>
    <rect class="card" x="0" y="288" width="358" height="120" rx="10"/>

    <text x="8" y="16" class="label">Cards clean — retícula hidden on mobile</text>
  </g>

  <rect x="0" y="812" width="390" height="32" fill="#ffffff"/>
</svg>